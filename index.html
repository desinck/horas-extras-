<title>Horas extras</title>
<style>
:root{--bg:#f3f2ee;--card:#fff;--ink:#1d2327;--mut:#66707a;--line:#dcdad2;--acc:#0b6e4f;--acc2:#e8f3ee;--warn:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#14181b;--card:#1e2427;--ink:#eceff1;--mut:#9aa5ad;--line:#333c41;--acc:#4cc59a;--acc2:#1b2f28;--warn:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:6px 0 12px}
h2{font-size:17px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 4px;font-weight:600}
input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px;min-height:48px}
input:focus{outline:none;border-color:var(--acc)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.f{margin-bottom:12px}
details{border:1.5px solid var(--line);border-radius:10px;padding:0 12px;margin-bottom:14px}
summary{padding:13px 0;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary span{color:var(--mut);font-weight:500}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:12px}
.names input{padding:10px;min-height:44px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;min-height:50px;padding:0 16px;cursor:pointer}
.btn{background:var(--acc);color:#fff;width:100%}
@media (prefers-color-scheme:dark){.btn,.bar .pdf{color:#06241a}}
.btn2{background:transparent;color:var(--mut);border:1.5px solid var(--line);width:100%;margin-top:8px}
.prev{display:flex;justify-content:space-between;align-items:center;background:var(--acc2);border-radius:10px;padding:10px 12px;margin:-2px 0 14px;font-size:14px}
.prev b{font-size:18px;color:var(--acc)}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--card)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.t{font-weight:700}
.sub{color:var(--mut);font-size:14px;margin-top:2px}
.hx{font-weight:800;color:var(--acc);white-space:nowrap;font-size:18px}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{min-height:40px;flex:1;background:var(--bg);color:var(--ink);font-size:14px;border:1px solid var(--line)}
.acts .del{color:var(--warn)}
.empty{text-align:center;color:var(--mut);padding:18px 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;justify-content:space-between;z-index:5}
.bar small{display:block;color:var(--mut);font-size:12px}
.bar strong{font-size:22px;color:var(--acc)}
.bar .pdf{background:var(--acc);color:#fff;min-width:140px}
#print{display:none}
.chk{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--ink);font-weight:600;margin:0 0 12px;min-height:44px}
.chk input{width:24px;height:24px;min-height:0;padding:0;accent-color:var(--acc)}
.tag{display:inline-block;font-size:12px;font-weight:700;background:var(--acc2);color:var(--acc);border-radius:6px;padding:2px 8px;margin:4px 0 2px}
.hint{font-size:13px;color:var(--mut);margin:-4px 0 12px}
.names label{margin-bottom:3px}
.pernav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.pernav>div{flex:1;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 8px;min-height:50px;display:flex;flex-direction:column;justify-content:center}
.pernav button{width:50px;background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:24px;padding:0}
.pernav small{color:var(--acc);font-size:12px;font-weight:600}
.chead{display:flex;align-items:center;width:100%;background:none;border:0;padding:0;min-height:44px;font:inherit;font-size:17px;font-weight:700;color:var(--ink);text-align:left;gap:8px}
.chead>span:first-child{flex:1}
.chead i{font-style:normal;font-size:24px;line-height:1;color:var(--mut);transition:transform .2s}
.chead[aria-expanded=false] i{transform:rotate(-90deg)}
.dsum{flex:0 1 auto!important;color:var(--mut);font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50%}
.cbody{margin-top:10px}
.cbody[hidden]{display:none}
.chk[hidden]{display:none}
.quick{display:flex;gap:8px;margin-top:8px}
.quick button{flex:1;min-height:42px;background:var(--bg);border:1.5px solid var(--line);color:var(--ink);font-size:15px}
.quick button.on{border-color:var(--acc);background:var(--acc2);color:var(--acc)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sh{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sh .btn2{margin-top:10px}
.wa{background:#1fa855;color:#fff}
.msg{font-size:14px;color:var(--mut);margin:12px 0 0}
@media print{
 @page{margin:14mm}
 body{background:#fff;color:#000;padding:0;font-size:12px}
 main,.bar,.sheet{display:none!important}
 #print{display:block}
 #print h1{font-size:20px;margin:0 0 4px}
 #print p{margin:2px 0;font-size:12px}
 table{width:100%;border-collapse:collapse;margin-top:12px}
 th,td{border:1px solid #999;padding:5px 6px;text-align:left;vertical-align:top;font-size:11px}
 th{background:#eee}
 td.r,th.r{text-align:right;white-space:nowrap}
 tfoot td{font-weight:700;background:#f4f4f4}
}
</style>
<script src="jspdf.umd.min.js"></script>
<script src="jspdf.plugin.autotable.min.js"></script>
</head>
<body>
<main>
 <h1>Horas extras</h1>
 <button class="btn2" id="install" hidden style="margin:0 0 14px">Instalar app en este celular</button>

 <div class="card">
  <button class="chead" id="dhead" aria-expanded="true"><span>Mis datos</span><span class="dsum" id="dsum"></span><i>&#8964;</i></button>
  <div class="cbody" id="dbody">
  <div class="f"><label for="nombre">Nombre</label><input id="nombre" placeholder="Tu nombre" autocomplete="name"></div>
  <details style="margin:0"><summary>Horario de salida por día <span>editar</span></summary><div class="names" id="hor"></div></details>
  </div>
 </div>

 <div class="card">
  <button class="chead" id="fhead" aria-expanded="true"><span id="ftitle">Nuevo registro</span><i>&#8964;</i></button>
  <div class="cbody" id="fbody">
  <div class="f"><label for="trabajo">Trabajo</label><input id="trabajo" placeholder="Ej: Instalación señalética" autocomplete="off"></div>
  <div class="row">
   <div><label for="ot">OT</label><input id="ot" placeholder="N° de OT" autocomplete="off"></div>
   <div><label for="dia">Día</label><input id="dia" type="date"></div>
  </div>
  <label class="chk"><input type="checkbox" id="fer"> Es feriado</label>
  <label class="chk" id="colChk"><input type="checkbox" id="col"> Trabajé en la colación</label>
  <div class="f" id="colWrap" hidden><label for="colMin">Minutos trabajados en colación (máx. 60)</label><input id="colMin" type="number" inputmode="numeric" min="1" max="60" placeholder="Ej: 30"><div class="quick"><button type="button" data-m="15">15</button><button type="button" data-m="30">30</button><button type="button" data-m="45">45</button><button type="button" data-m="60">60</button></div></div>
  <div class="f" id="entWrap" hidden><label for="entrada">Hora de entrada</label><input id="entrada" type="time"></div>
  <div class="f"><label for="salida">Hora de salida</label><input id="salida" type="time"></div>
  <div class="hint" id="hint"></div>
  <div class="prev"><span>Horas extras de este registro</span><b id="prev">0h 00m</b></div>
  <details id="det">
   <summary>Con quién trabajé <span id="cnt">0 de 8</span></summary>
   <div class="names" id="names"></div>
  </details>
  <button class="btn" id="save">Guardar registro</button>
  <button class="btn2" id="cancel" hidden>Cancelar edición</button>
  </div>
 </div>

 <h2 style="margin:18px 2px 10px">Registros del periodo</h2>
 <div class="pernav"><button id="pPrev" aria-label="Periodo anterior">&#8249;</button><div><b id="pLabel"></b><small id="pNote"></small></div><button id="pNext" aria-label="Periodo siguiente">&#8250;</button></div>
 <div id="list"></div>
 <button class="btn2" id="clear" style="margin-bottom:12px">Borrar registros de este periodo</button>
</main>

<div class="bar">
 <div><small id="n">0 registros</small><strong id="tot">0h 00m</strong></div>
 <button class="pdf" id="pdf">Enviar PDF</button>
</div>

<div class="sheet" id="sheet" hidden>
 <div class="sh">
  <h2>Enviar horas extras</h2>
  <button class="btn wa" id="shShare">Compartir PDF por WhatsApp</button>
  <button class="btn2" id="shText">Enviar resumen como mensaje</button>
  <button class="btn2" id="shSave">Solo guardar PDF</button>
  <button class="btn2" id="shClose">Cerrar</button>
  <p class="msg" id="msg"></p>
 </div>
</div>
<div id="print"></div>
<datalist id="dl"></datalist>

<script>
const $=s=>document.querySelector(s);
const KEY='horasExtrasV1';
const HOR0={1:'18:30',2:'18:30',3:'18:00',4:'18:00',5:'16:30'};
const DN={1:'Lunes',2:'Martes',3:'Miércoles',4:'Jueves',5:'Viernes'};
let S={nombre:'',periodo:'',hor:Object.assign({},HOR0),items:[]};
let editId=null;
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.items)S=Object.assign(S,d)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tm=h=>{const [a,b]=h.split(':').map(Number);return a*60+b};
function calc(salida,desde){
 if(!salida||!desde)return 0;
 let m=tm(salida)-tm(desde);
 if(m<0&&tm(salida)<360)m+=1440; // salida pasada la medianoche
 return Math.max(0,m);
}
const fmt=m=>Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m';
const fdate=d=>{if(!d)return'';const x=new Date(d+'T12:00');return x.toLocaleDateString('es-CL',{weekday:'short',day:'2-digit',month:'short'})};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

// tipo de día y horas extras de un registro
function info(x){
 const dow=new Date(x.dia+'T12:00').getDay();
 if(x.fer||dow===0||dow===6){
  const tipo=x.fer?'Feriado':(dow===0?'Domingo':'Sábado');
  return {libre:true,tipo,m:calc(x.salida,x.entrada)};
 }
 const f=S.hor[dow]||'18:00';
 const c=Math.min(60,Math.max(0,parseInt(x.col)||0));
 return {libre:false,tipo:'Jornada hasta '+f,col:c,m:calc(x.salida,f)+c};
}
const sorted=()=>[...S.items].sort((a,b)=>a.dia.localeCompare(b.dia)||a.salida.localeCompare(b.salida));
// Periodos: del 26 de un mes al 25 del siguiente. Se identifican por el mes en que cierran (AAAA-MM)
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const pad=n=>String(n).padStart(2,'0');
function shift(per,k){let [y,m]=per.split('-').map(Number);m+=k;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+'-'+pad(m)}
function perOf(dia){const [y,m,d]=dia.split('-').map(Number);return d>25?shift(y+'-'+pad(m),1):y+'-'+pad(m)}
function perLabel(per){
 const [y,m]=per.split('-').map(Number),a=shift(per,-1).split('-').map(Number);
 return '26 '+MES[a[1]-1]+(a[0]!==y?' '+a[0]:'')+' al 25 '+MES[m-1]+' '+y;
}
let per=perOf(today());
const note=t=>$('#pNote').textContent=t||'';
function stats(){
 let tot=0,sem=0,lib=0;
 const rows=sorted().filter(x=>perOf(x.dia)===per).map(x=>{const i=info(x);tot+=i.m;if(i.libre)lib+=i.m;else sem+=i.m;return {x,i}});
 return {rows,tot,sem,lib};
}

// horarios por día
$('#hor').innerHTML=[1,2,3,4,5].map(d=>`<div><label for="h${d}">${DN[d]}</label><input id="h${d}" type="time" data-d="${d}" value="${S.hor[d]||HOR0[d]}"></div>`).join('');
$('#hor').addEventListener('input',e=>{const d=e.target.dataset.d;if(d){S.hor[d]=e.target.value;save();render();upd()}});

// campos de nombres
const names=$('#names');
for(let i=0;i<8;i++){const inp=document.createElement('input');inp.placeholder='Persona '+(i+1);inp.setAttribute('list','dl');inp.autocomplete='off';inp.addEventListener('input',upd);names.appendChild(inp)}
const nInputs=()=>[...names.querySelectorAll('input')];
const formItem=()=>({dia:$('#dia').value,fer:$('#fer').checked,entrada:$('#entrada').value,salida:$('#salida').value,col:$('#col').checked?($('#colMin').value||0):0});
function upd(){
 $('#cnt').textContent=nInputs().filter(i=>i.value.trim()).length+' de 8';
 const x=formItem(),i=x.dia?info(x):null;
 $('#entWrap').hidden=!(i&&i.libre);
 const lib=!!(i&&i.libre);$('#colChk').hidden=lib;$('#colWrap').hidden=lib||!$('#col').checked;
 document.querySelectorAll('.quick button').forEach(b=>b.classList.toggle('on',b.dataset.m===String($('#colMin').value)));
 $('#hint').textContent=i?(i.libre?i.tipo+': sin jornada, todo lo trabajado cuenta como extra':i.tipo):'';
 $('#prev').textContent=fmt(i?i.m:0);
}
['dia','fer','entrada','salida','col','colMin'].forEach(id=>{$('#'+id).addEventListener('input',upd);$('#'+id).addEventListener('change',upd)});
$('#colWrap').addEventListener('click',e=>{const m=e.target.dataset.m;if(m){$('#colMin').value=m;upd()}});
['nombre'].forEach(id=>$('#'+id).addEventListener('input',()=>{S[id]=$('#'+id).value;save()}));

function reset(){
 editId=null;
 ['trabajo','ot','salida','entrada'].forEach(i=>$('#'+i).value='');
 $('#fer').checked=false;$('#col').checked=false;$('#colMin').value='';
 $('#dia').value=today();
 nInputs().forEach(i=>i.value='');
 $('#ftitle').textContent='Nuevo registro';
 $('#save').textContent='Guardar registro';
 $('#cancel').hidden=true;
 upd();
}
$('#save').onclick=()=>{
 const trabajo=$('#trabajo').value.trim(),salida=$('#salida').value,dia=$('#dia').value;
 if(!trabajo||!dia||!salida){alert('Completa Trabajo, Día y Hora de salida.');return}
 const f=formItem(),libre=info(f).libre;
 if(libre&&!f.entrada){alert('Este día no tiene jornada: indica la Hora de entrada.');return}
 if(!libre&&$('#col').checked){const v=parseInt($('#colMin').value);if(!v||v<1){alert('Indica cuántos minutos trabajaste en la colación (1 a 60).');return}if(v>60){alert('La colación tiene un máximo de 60 minutos.');return}}
 const rec={id:editId||Date.now(),trabajo,ot:$('#ot').value.trim(),dia,fer:f.fer,entrada:libre?f.entrada:'',col:libre?0:(parseInt(f.col)||0),salida,con:nInputs().map(i=>i.value.trim()).filter(Boolean)};
 if(editId){S.items=S.items.map(x=>x.id===editId?rec:x)}else S.items.push(rec);
 save();const np=perOf(dia),moved=np!==per;per=np;reset();setForm(false);render();note(moved?'Guardado en este periodo':'');window.scrollTo({top:document.getElementById('list').offsetTop-20,behavior:'smooth'});
};
$('#cancel').onclick=()=>{reset();setForm(false)};
$('#clear').onclick=()=>{const ids=stats().rows.map(r=>r.x.id);if(ids.length&&confirm('¿Borrar los '+ids.length+' registros del periodo '+perLabel(per)+'?')){S.items=S.items.filter(x=>!ids.includes(x.id));save();reset();render()}};
$('#pPrev').onclick=()=>{per=shift(per,-1);note('');render()};
$('#pNext').onclick=()=>{per=shift(per,1);note('');render()};

function render(){
 const st=stats();
 $('#pLabel').textContent=perLabel(per);
 $('#list').innerHTML=st.rows.length?st.rows.map(({x,i})=>`<div class="item"><div class="top"><div><div class="t">${esc(x.trabajo)}</div>
  <div class="sub">${esc(fdate(x.dia))}${x.ot?' · OT <b>'+esc(x.ot)+'</b>':''}</div>
  <span class="tag">${esc(i.tipo)}</span>${i.col?' <span class="tag">+'+i.col+' min colación</span>':''}
  <div class="sub">${i.libre?'Entrada '+esc(x.entrada||'?')+' · ':''}Salida ${esc(x.salida)}</div>
  ${x.con.length?`<div class="sub">Con: <b>${x.con.map(esc).join(', ')}</b></div>`:''}</div>
  <div class="hx">${fmt(i.m)}</div></div>
  <div class="acts"><button data-e="${x.id}">Editar</button><button class="del" data-d="${x.id}">Eliminar</button></div></div>`).join('')
  :'<div class="empty">Aún no hay registros en este periodo.<br>Completa el formulario y toca Guardar.</div>';
 $('#tot').textContent=fmt(st.tot);
 $('#n').textContent=st.rows.length+(st.rows.length===1?' registro':' registros');
 const set=new Set();S.items.forEach(x=>x.con.forEach(n=>set.add(n)));
 $('#dl').innerHTML=[...set].map(n=>`<option value="${esc(n)}">`).join('');
 document.body.appendChild($('#dl'));
}
$('#list').addEventListener('click',e=>{
 const d=e.target.dataset.d,ed=e.target.dataset.e;
 if(d&&confirm('¿Eliminar este registro?')){S.items=S.items.filter(x=>x.id!=d);save();render()}
 if(ed){const x=S.items.find(i=>i.id==ed);if(!x)return;editId=x.id;
  $('#trabajo').value=x.trabajo;$('#ot').value=x.ot;$('#dia').value=x.dia;$('#fer').checked=!!x.fer;$('#entrada').value=x.entrada||'';$('#col').checked=!!x.col;$('#colMin').value=x.col||'';$('#salida').value=x.salida;
  nInputs().forEach((i,k)=>i.value=x.con[k]||'');
  $('#det').open=x.con.length>0;
  setForm(true);$('#ftitle').textContent='Editando registro';$('#save').textContent='Guardar cambios';$('#cancel').hidden=false;
  upd();window.scrollTo({top:0,behavior:'smooth'})}
});

const horTxt=()=>'Lun '+S.hor[1]+' | Mar '+S.hor[2]+' | Mié '+S.hor[3]+' | Jue '+S.hor[4]+' | Vie '+S.hor[5];
const horario=(x,i)=>i.libre?(x.entrada||'?')+' a '+x.salida:'salida '+x.salida+(i.col?' (+'+i.col+' min colación)':'');

function buildPrint(){
 const st=stats();
 const rows=st.rows.map(({x,i})=>`<tr><td>${esc(fdate(x.dia))}</td><td>${esc(i.tipo)}</td><td><b>${esc(x.ot)}</b></td><td>${esc(x.trabajo)}</td><td>${esc(horario(x,i))}</td><td><b>${x.con.map(esc).join(', ')}</b></td><td class="r">${fmt(i.m)}</td></tr>`).join('');
 $('#print').innerHTML=`<h1>Registro de horas extras</h1>
 <p style="font-size:14px"><b>Nombre: ${esc(S.nombre||'—')}</b></p><p>Periodo (corte día 25): ${esc(perLabel(per))}</p><p>Horarios de salida: ${esc(horTxt())}</p>
 <table><thead><tr><th>Día</th><th>Tipo</th><th>OT</th><th>Trabajo</th><th>Horario</th><th>Con quién</th><th class="r">Extras</th></tr></thead>
 <tbody>${rows||'<tr><td colspan="7">Sin registros</td></tr>'}</tbody>
 <tfoot><tr><td colspan="6">Subtotal días de semana</td><td class="r">${fmt(st.sem)}</td></tr>
 <tr><td colspan="6">Subtotal fines de semana y feriados</td><td class="r">${fmt(st.lib)}</td></tr>
 <tr><td colspan="6">Total horas extras</td><td class="r">${fmt(st.tot)}</td></tr></tfoot></table>`;
}
window.addEventListener('beforeprint',buildPrint);

function fname(){return 'horas-extras-'+per+'.pdf'}
function pdfBlob(){
 const J=window.jspdf;if(!J)return null;
 const doc=new J.jsPDF({unit:'mm',format:'a4'});
 const st=stats();
 doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text('Registro de horas extras',14,16);
 doc.setFontSize(12);doc.text('Nombre: '+(S.nombre||'-'),14,24);
 doc.setFont('helvetica','normal');doc.setFontSize(10);
 doc.text('Periodo (corte día 25): '+perLabel(per),14,30);
 doc.text('Horarios de salida: '+horTxt(),14,35);
 const body=st.rows.map(({x,i})=>[fdate(x.dia),i.tipo,x.ot||'',x.trabajo,horario(x,i),x.con.join(', '),fmt(i.m)]);
 const R=(c,t)=>[{content:c,colSpan:6},{content:t,styles:{halign:'right'}}];
 doc.autoTable({startY:40,head:[['Día','Tipo','OT','Trabajo','Horario','Con quién','Extras']],body,
  foot:[R('Subtotal días de semana',fmt(st.sem)),R('Subtotal fines de semana y feriados',fmt(st.lib)),R('Total horas extras',fmt(st.tot))],
  styles:{fontSize:8.5,cellPadding:2},headStyles:{fillColor:[11,110,79]},footStyles:{fillColor:[230,240,236],textColor:20,fontStyle:'bold'},
  columnStyles:{0:{cellWidth:22},1:{cellWidth:24},2:{cellWidth:18},4:{cellWidth:24},6:{halign:'right',cellWidth:20}},
  didParseCell:d=>{if(d.section==='body'&&(d.column.index===2||d.column.index===5))d.cell.styles.fontStyle='bold'}});
 return doc.output('blob');
}
async function download(b){
 let dl=null;
 try{if(typeof claude!=='undefined')dl=await claude.use('downloads')}catch(e){}
 if(dl){try{await dl.save({filename:fname(),data:b});return 'saved'}catch(e){return e&&e.code==='declined'?'declined':'error'}}
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fname();document.body.appendChild(a);a.click();a.remove();return 'saved';
}
function resumen(){
 const st=stats();
 const l=st.rows.map(({x,i})=>'- '+fdate(x.dia)+' | '+i.tipo+(x.ot?' | OT *'+x.ot+'*':'')+' | '+x.trabajo+' | '+horario(x,i)+' | '+fmt(i.m)+(x.con.length?' | con: '+x.con.map(n=>'*'+n+'*').join(', '):''));
 return 'Horas extras'+(S.nombre?' - *'+S.nombre+'*':'')+' ('+perLabel(per)+')'+'\n'+l.join('\n')+'\nDías de semana: '+fmt(st.sem)+'\nFines de semana y feriados: '+fmt(st.lib)+'\n*TOTAL: '+fmt(st.tot)+'*';
}
const msg=t=>$('#msg').textContent=t||'';
$('#pdf').onclick=()=>{if(!stats().rows.length){alert('No hay registros en este periodo para enviar.');return}msg('');$('#sheet').hidden=false};
$('#shClose').onclick=()=>$('#sheet').hidden=true;
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')e.target.hidden=true});
$('#shShare').onclick=async()=>{
 const b=pdfBlob();
 if(!b){msg('Para crear el PDF se necesita internet la primera vez. Prueba con "Enviar resumen como mensaje".');return}
 const f=new File([b],fname(),{type:'application/pdf'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){
  try{await navigator.share({files:[f],title:'Horas extras',text:'Horas extras'+' '+perLabel(per)})}
  catch(e){if(e&&e.name!=='AbortError'){const r=await download(b);msg(r==='saved'?'No se pudo abrir el menú de compartir. Se guardó el PDF: adjúntalo en WhatsApp con el clip.':'')}}
 }else{
  const r=await download(b);msg(r==='saved'?'Este navegador no deja compartir directo. Se guardó el PDF: adjúntalo en WhatsApp con el clip.':'');
 }
};
$('#shText').onclick=()=>{window.open('https://wa.me/?text='+encodeURIComponent(resumen()),'_blank')};
$('#shSave').onclick=async()=>{
 const b=pdfBlob();
 if(b){const r=await download(b);msg(r==='saved'?'PDF guardado.':(r==='declined'?'':'No se pudo guardar el PDF.'))}else{buildPrint();window.print()}
};

function toggle(h,b,o){h.setAttribute('aria-expanded',o);b.hidden=!o}
function setForm(o){toggle($('#fhead'),$('#fbody'),o)}
function setData(o){toggle($('#dhead'),$('#dbody'),o);$('#dsum').textContent=o?'':(S.nombre||'')}
$('#fhead').onclick=()=>setForm($('#fbody').hidden);
$('#dhead').onclick=()=>setData($('#dbody').hidden);
$('#nombre').value=S.nombre||'';setData(!S.nombre);
reset();render();
let dip=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('#install').hidden=false});
$('#install').onclick=async()=>{if(!dip)return;dip.prompt();try{await dip.userChoice}catch(e){}dip=null;$('#install').hidden=true};
addEventListener('appinstalled',()=>{$('#install').hidden=true});
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
